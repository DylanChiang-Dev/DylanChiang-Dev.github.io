<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" lang="zh-TW">
  <title id="title">AI 協作音樂與視覺製作流程示意</title>
  <desc id="desc">六個步驟：創作方向、音樂判斷、可編輯材料、渲染與試聽、視覺整合、修訂與檢核。此圖不使用原作素材。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#72624c" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#f6f2eb"/>
  <g font-family="sans-serif" fill="#28251f">
    <text x="56" y="66" font-size="34" font-weight="700">從創作意圖到可反覆修訂的製作流程</text>
    <text x="56" y="102" font-size="20" fill="#625a4e">方法示意，不含原作素材</text>
    <g fill="#ffffff" stroke="#c9bba6" stroke-width="2">
      <rect x="56" y="146" width="328" height="144" rx="16"/>
      <rect x="436" y="146" width="328" height="144" rx="16"/>
      <rect x="816" y="146" width="328" height="144" rx="16"/>
      <rect x="56" y="370" width="328" height="144" rx="16"/>
      <rect x="436" y="370" width="328" height="144" rx="16"/>
      <rect x="816" y="370" width="328" height="144" rx="16"/>
    </g>
    <g font-size="26" font-weight="700">
      <text x="80" y="198">01　創作方向</text><text x="460" y="198">02　音樂判斷</text><text x="840" y="198">03　可編輯材料</text>
      <text x="80" y="422">04　渲染與試聽</text><text x="460" y="422">05　視覺整合</text><text x="840" y="422">06　修訂與檢核</text>
    </g>
    <g font-size="20" fill="#625a4e">
      <text x="80" y="246">目標、表達與製作限制</text><text x="460" y="246">曲式、配器與聲部關係</text><text x="840" y="246">音符、譜面與事件時間軸</text>
      <text x="80" y="470">音色、奏法與聽感比較</text><text x="460" y="470">素材、動畫與共同時序</text><text x="840" y="470">視聽判斷與程式檢查</text>
    </g>
    <text x="56" y="578" font-size="22" font-weight="700">創作者決定取捨，AI 協助生成與實作；各步驟可返回修訂。</text>
  </g>
  <g fill="none" stroke="#72624c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M392 218H422"/><path d="M772 218H802"/>
    <path d="M980 302V328H220V354"/>
    <path d="M392 442H422"/><path d="M772 442H802"/>
  </g>
</svg>
