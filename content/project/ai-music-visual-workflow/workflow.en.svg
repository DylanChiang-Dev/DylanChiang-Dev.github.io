<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">AI-assisted music and visual production workflow illustration</title>
  <desc id="desc">Six steps: creative direction, musical judgment, editable materials, rendering and listening, visual integration, and revision and checks. No original work assets are used.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#72624c" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#f6f2eb"/>
  <g font-family="sans-serif" fill="#28251f">
    <text x="56" y="66" font-size="34" font-weight="700">From creative intent to an iterative workflow</text>
    <text x="56" y="102" font-size="20" fill="#625a4e">Method illustration only. No original work assets.</text>
    <g fill="#ffffff" stroke="#c9bba6" stroke-width="2">
      <rect x="56" y="146" width="328" height="144" rx="16"/>
      <rect x="436" y="146" width="328" height="144" rx="16"/>
      <rect x="816" y="146" width="328" height="144" rx="16"/>
      <rect x="56" y="370" width="328" height="144" rx="16"/>
      <rect x="436" y="370" width="328" height="144" rx="16"/>
      <rect x="816" y="370" width="328" height="144" rx="16"/>
    </g>
    <g font-size="24" font-weight="700">
      <text x="80" y="198">01  Creative direction</text><text x="460" y="198">02  Musical judgment</text><text x="840" y="198">03  Editable materials</text>
      <text x="80" y="422">04  Render and listen</text><text x="460" y="422">05  Visual integration</text><text x="840" y="422">06  Revise and check</text>
    </g>
    <g font-size="18" fill="#625a4e">
      <text x="80" y="246">Goals, expression, constraints</text><text x="460" y="246">Form, orchestration, voices</text><text x="840" y="246">Notes, notation, event timeline</text>
      <text x="80" y="470">Timbre, articulation, comparison</text><text x="460" y="470">Assets, animation, shared timing</text><text x="840" y="470">Perception and technical checks</text>
    </g>
    <text x="56" y="578" font-size="22" font-weight="700">Creator-led decisions, AI-assisted generation; each stage can be revisited.</text>
  </g>
  <g fill="none" stroke="#72624c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M392 218H422"/><path d="M772 218H802"/>
    <path d="M980 302V328H220V354"/>
    <path d="M392 442H422"/><path d="M772 442H802"/>
  </g>
</svg>
